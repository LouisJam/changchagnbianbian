    function Button({ type = 'default', size = 'middle', loading, disabled, ghost, block, children, onClick, className = '', ...rest }) {
      const cls = ['ai-btn', `ai-btn--${size}`];
      if (loading) cls.push('ai-btn--loading');
      else if (type === 'primary') cls.push('ai-btn--primary');
      else if (type === 'danger' && rest.primary) cls.push('ai-btn--danger-primary');
      else cls.push(`ai-btn--${type}`);
      if (ghost) cls.push('ai-btn--ghost');
      if (block) cls.push('ai-btn--block');
      if (className) cls.push(className);
      return <button type="button" className={cls.join(' ')} disabled={disabled || loading} onClick={onClick} {...rest}>{children}</button>;
    }

    function Input({ size = 'middle', shadow, status, disabled, value, onChange, placeholder, prefix, suffix, allowClear, className = '', ...rest }) {
      const cls = ['ai-input', `ai-input--${size}`];
      if (shadow) cls.push('ai-input--shadow');
      if (status === 'error') cls.push('ai-input--error');
      if (status === 'warning') cls.push('ai-input--warning');
      return (
        <div className={`ai-input-wrap ${className}`}>
          {prefix && <span className="ai-input-affix">{prefix}</span>}
          <input className={cls.join(' ')} disabled={disabled} value={value} onChange={onChange} placeholder={placeholder} {...rest} />
          {allowClear && value && <button type="button" className="ai-input-clear" onClick={() => onChange?.({ target: { value: '' } })}><Icon name="close" size={12} /></button>}
          {suffix && <span className="ai-input-affix">{suffix}</span>}

      const cls = ['ai-switch', size === 'small' && 'ai-switch--small', checked && 'ai-switch--checked', disabled && 'ai-switch--disabled', className].filter(Boolean).join(' ');
      return (
        <div className={cls} role="switch" aria-checked={checked} tabIndex={disabled ? -1 : 0}

          <div className="ai-switch-track"><div className="ai-switch-handle" /></div>
        </div>

          <span className="ai-checkbox-box">{checked && <Icon name="check" size={size === 'large' ? 16 : 12} color="#fff" />}</span>
          {children && <span className="ai-checkbox-label">{children}</span>}

            return (
              <label key={opt.value} className={['ai-radio-item', sel && 'ai-radio-item--checked', dis && 'ai-radio-item--disabled'].filter(Boolean).join(' ')}

      else if (color) cls.push(`ai-card--color-${color}`);

    function Collapse({ items = [], defaultActiveKey, accordion = true }) {
      const [active, setActive] = useState(defaultActiveKey ? (Array.isArray(defaultActiveKey) ? defaultActiveKey : [defaultActiveKey]) : []);
      const toggle = (key) => {
        if (accordion) setActive(prev => prev.includes(key) ? [] : [key]);
        else setActive(prev => prev.includes(key) ? prev.filter(k => k !== key) : [...prev, key]);
      };
      return (
        <div>{items.map(item => {
          const open = active.includes(item.key);
          return (
            <div key={item.key} className={`ai-collapse ${open ? 'ai-collapse--open' : ''}`}>
              <div className="ai-collapse-header" onClick={() => toggle(item.key)}>
                <span className="ai-collapse-icon">{open ? '−' : '+'}</span>

    function Select({ options = [], value, onChange, placeholder = '请选择' }) {
      const [open, setOpen] = useState(false);

      return (
        <div ref={ref} className={`ai-select ${open ? 'ai-select--open' : ''}`}>
          <div className="ai-select-trigger" onClick={() => setOpen(!open)}>

        <div className="placeholder-page">
          <Title color={titleColors[pageKey] || 'app-teal'} size="large">{item?.icon} {item?.label}</Title>
          <p style={{ marginTop: 24, color: 'var(--text-secondary)' }}>此页面正在建设中，敬请期待～</p>
          <div style={{ marginTop: 32, maxWidth: 400, margin: '32px auto 0' }}>
            <Card pattern={cardPatterns[pageKey] || 'default'}>
              <p>功能即将上线，可以先在首页逛逛店铺介绍和公告哦！</p>
            </Card>
          </div>
        </div>
      );
    }

    function LoginModal({ open, onClose, onSuccess }) {
      const [mode, setMode] = useState('login');
      return (
        <Modal open={open} onClose={onClose} title={mode === 'login' ? '微信扫码登录' : '注册账号'}
          okText="模拟登录成功" showCancel onOk={() => onSuccess({ id: 'u_' + Date.now(), nickname: '岛民' + Math.floor(Math.random()*1000) })}>
          <p style={{ fontSize: 14, marginBottom: 8, color: 'var(--text-secondary)' }}>
            基于 CloudBase 微信网页扫码登录（演示模式）
          </p>
          <div className="login-qr">微信扫码<br/>登录区域</div>
          <p style={{ fontSize: 12, textAlign: 'center', color: 'var(--text-muted)' }}>请使用微信扫描二维码登录</p>
          <div style={{ marginTop: 16, textAlign: 'center' }}>
            <Button type="link" size="small" onClick={() => setMode(m => m === 'login' ? 'register' : 'login')}>
              {mode === 'login' ? '没有账号？去注册' : '已有账号？去登录'}
            </Button>
          </div>
        </Modal>
      );
    }

    function App() {
      const isMobile = useIsMobile();
      const [page, setPage] = useState('home');
      const [drawerOpen, setDrawerOpen] = useState(false);
      const [user, setUser] = useState(null);
      const [loginOpen, setLoginOpen] = useState(false);
      const [pendingAction, setPendingAction] = useState(null);

      const navigate = useCallback((key) => {
        if (key === page) return;
        setPage(key);
        setDrawerOpen(false);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }, [page]);

      const requireAuth = useCallback((action) => {
        if (!user) { setPendingAction(action); setLoginOpen(true); return false; }
        return true;
      }, [user]);

      const handleLoginSuccess = (u) => {
        setUser(u);
        setLoginOpen(false);
        if (pendingAction) setPendingAction(null);
      };

      const handleLogout = () => { setUser(null); setPendingAction(null); };

      const pageContent = page === 'home'
        ? <HomePage onNavigate={navigate} isMobile={isMobile} user={user} onRequireAuth={requireAuth} />
        : <PlaceholderPage pageKey={page} />;

      return (
        <Cursor>
          <div className="page-shell">
            {!isMobile && (
              <aside className="sidebar">
                <NavMenu current={page} onNavigate={navigate} />
              </aside>
            )}

            {isMobile && (
              <>
                <header className="mobile-header">
                  <Button type="text" size="small" onClick={() => setDrawerOpen(true)}><Icon name="menu" size={22} color="#794f27" /></Button>
                  <span className="mobile-title">肠肠扁扁</span>
                  <UserCenter user={user} onLogin={() => setLoginOpen(true)} onLogout={handleLogout} onRequireAuth={requireAuth} isMobile />
                </header>
                <div className={`drawer-overlay ${drawerOpen ? 'open' : ''}`} onClick={() => setDrawerOpen(false)} />
                <nav className={`mobile-drawer ${drawerOpen ? 'open' : ''}`}>
                  <div style={{ padding: '0 20px 16px', fontWeight: 800, fontSize: 18, color: 'var(--text)', borderBottom: '2px dashed var(--border)', marginBottom: 8 }}>🐾 肠肠扁扁</div>
                  <NavMenu current={page} onNavigate={navigate} inDrawer />
                </nav>
              </>
            )}

            <div className="main-area">
              {!isMobile && (
                <div className="top-bar">
                  <UserCenter user={user} onLogin={() => setLoginOpen(true)} onLogout={handleLogout} onRequireAuth={requireAuth} isMobile={false} />
                </div>
              )}
              <main className="main-content">{pageContent}</main>
              <div className="page-footer"><Footer type="tree" /></div>
            </div>
          </div>
          <LoginModal open={loginOpen} onClose={() => setLoginOpen(false)} onSuccess={handleLoginSuccess} />
        </Cursor>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
